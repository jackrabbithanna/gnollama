name: Validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-soup-3.0 gir1.2-secret-1
      - run: pip install PyGObject==3.50.0 -r requirements.lock
      - run: python tests/run_core.py
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder xvfb
      - name: Install GNOME SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50
      - name: Build and test
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse _flatpak io.github.jackrabbithanna.Gnollama.json
          xvfb-run -a flatpak build --readonly --share=network --socket=x11 --filesystem="$PWD" --build-dir="$PWD" --env=GNOLLAMA_REQUIRE_DISPLAY=1 --env=GDK_BACKEND=x11 --env=GSK_RENDERER=cairo _flatpak sh -c 'python3 tools/check_dependencies.py && meson setup _build --prefix=/app && meson compile -C _build && meson test -C _build --print-errorlogs'
      - name: Capture GTK layouts
        run: xvfb-run -a flatpak build --readonly --share=network --socket=x11 --filesystem="$PWD" --build-dir="$PWD" --env=GDK_BACKEND=x11 --env=GSK_RENDERER=cairo _flatpak python3 tools/review_layout.py --resource _build/src/gnollama.gresource --output validation-screenshots
      - name: Record performance and retrieval artifacts
        run: flatpak build --readonly --share=network --socket=x11 --filesystem="$PWD" --build-dir="$PWD" _flatpak sh -c 'python3 tools/benchmark_workspace.py --output workspace-benchmark.json && python3 tools/evaluate_retrieval.py --output retrieval-evaluation.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner }}
          path: |
            .flatpak-builder/build/gnollama-*/_flatpak_build/meson-logs/
            _build/meson-logs/
            workspace-benchmark.json
            retrieval-evaluation.json
            validation-screenshots/
